<!DOCTYPE html>
<html lang="pt-br">
 
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Espaço de Foco</title>
    <link rel="stylesheet" href="estilo.css" />
</head>
 
<body>
    
    <div class="background"></div>
 
    <div class="container">
        <aside class="barraLateral">
            <h2>Meus Links</h2>
            <ul>
                <li><a href="https://pt.wikipedia.org/wiki/Wikip%C3%A9dia:P%C3%A1gina_principal">Wikipedia</a></li>
                <li><a href="https://www.youtube.com/">Youtube</a></li>
                <li><a href="https://www.youtube.com/watch?v=RRNoneVfE9Q">Música </a></li>
                <li><a href="https://www.fiap.com.br/">FIAP</a></li>
            </ul>
        </aside>
 
        <main class="areaFoco">
            <header>
                <h1>Espaço de <br> Foco Digital</h1>
            </header>
            <h2>Notas</h2><br>
            <textarea placeholder="Anotações rápidas..."></textarea>
            
            <input type="checkbox" id="startPomodoro" hidden>
            <label for="startPomodoro" class="botaoPomodoro">🍅 Pomodoro</label>

            <div class="pomodoro-box">
                <div class="barra barra-pomodoro"></div>
                <div class="barra barra-descanso"></div>
                
                
                <div class="contador contador-pomodoro">25:00</div>
                <div class="contador contador-descanso">5:00</div>
            </div>
        </main>
    </div>
    
</body>
 
</html>
